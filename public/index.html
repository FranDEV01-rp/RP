<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Receptor de Audio - CarDash & Radio FM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0d13; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    .container { width: 100%; max-width: 750px; background: #141722; border-radius: 16px; padding: 25px; border: 1px solid #23293c; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-size: 22px; text-align: center; margin-bottom: 5px; color: #fff; }
    .subtitle { text-align: center; font-size: 13px; color: #7f8ba4; margin-bottom: 20px; }
    
    .user-box { display: flex; gap: 10px; margin-bottom: 20px; background: #1c2233; padding: 12px; border-radius: 10px; }
    input[type="text"] { flex: 1; background: #0e111a; border: 1px solid #2e374d; border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
    button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2563eb; }

    .unlock-banner { background: #f59e0b; color: #000; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 20px; cursor: pointer; display: block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

    /* Paneles duales */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

    .card { background: #1a1e2d; border-radius: 12px; padding: 16px; border: 2px solid #283046; position: relative; transition: 0.3s; }
    .card.active { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    
    .card-title { font-size: 14px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .tag { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
    .tag-live { background: #ef4444; color: #fff; }
    .tag-yt { background: #ff0000; color: #fff; }

    .station-name { font-size: 16px; font-weight: bold; color: #60a5fa; min-height: 40px; }
    .vol-display { font-size: 12px; color: #94a3b8; margin-top: 10px; }
    
    .yt-frame-wrapper { border-radius: 10px; overflow: hidden; background: #000; width: 100%; aspect-ratio: 16/9; margin-top: 10px; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Receptor Vehicular Sincronizado</h1>
    <div class="subtitle">CarDash Multimedia & Radio Stereo Argentina</div>

    <div id="unlockBtn" class="unlock-banner" onclick="unlockAudio()">
      🔊 TOCÁ AQUÍ PARA HABILITAR EL AUDIO EN EL NAVEGADOR
    </div>

    <div class="user-box">
      <input type="text" id="userIdInput" placeholder="Ingresá tu Roblox UserId (ej: 3618165542)">
      <button onclick="saveUserId()">Conectar</button>
    </div>

    <div class="grid">
      <!-- TARJETA CARDASH (YOUTUBE) -->
      <div id="cardashCard" class="card">
        <div class="card-title">
          <span>CarDash</span>
          <span class="tag tag-yt">YouTube</span>
        </div>
        <div class="station-name" id="cardashTitle">Sin reproducir</div>
        <div class="vol-display" id="cardashVol">Volumen: 100%</div>
        <div class="yt-frame-wrapper">
          <div id="yt-player"></div>
        </div>
      </div>

      <!-- TARJETA RADIO ARGENTINA -->
      <div id="radioCard" class="card">
        <div class="card-title">
          <span>Stereo FM</span>
          <span class="tag tag-live">EN VIVO ARG</span>
        </div>
        <div class="station-name" id="radioStationTitle">FM Vida Rosario 97.9</div>
        <div class="vol-display" id="radioVol">Volumen: 100%</div>
        <div style="margin-top: 25px; text-align: center; color: #64748b; font-size: 13px;">
          Transmisión Nacional Directa
        </div>
      </div>
    </div>
  </div>

  <!-- Elemento de audio nativo para las radios argentinas -->
  <audio id="nativeRadioAudio" preload="none"></audio>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer = null;
    let isYtReady = false;
    let audioUnlocked = false;

    const radioAudio = document.getElementById('nativeRadioAudio');
    const unlockBtn = document.getElementById('unlockBtn');
    const userIdInput = document.getElementById('userIdInput');

    let currentUserId = localStorage.getItem('cardash_user_id') || '3618165542';
    userIdInput.value = currentUserId;

    function saveUserId() {
      currentUserId = userIdInput.value.trim();
      localStorage.setItem('cardash_user_id', currentUserId);
      alert('Conectado a UserId: ' + currentUserId);
    }

    // Desbloqueo de audio por políticas del navegador
    function unlockAudio() {
      audioUnlocked = true;
      unlockBtn.style.display = 'none';
      
      // Desbloquear audio nativo
      radioAudio.play().then(() => radioAudio.pause()).catch(() => {});
      
      // Desbloquear YouTube
      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
      }
    }

    // Inicializar IFrame de YouTube
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'disablekb': 1,
          'playsinline': 1
        },
        events: {
          'onReady': () => { isYtReady = true; }
        }
      });
    }

    let lastYtVideoId = "";
    let lastRadioStation = "";

    // Polling regular al backend de Render
    async function pollStatus() {
      if (!currentUserId) return;

      try {
        const res = await fetch(`/api/status/${currentUserId}`);
        if (!res.ok) return;
        const data = await res.json();

        const cardash = data.cardash;
        const radio = data.radio;
        const activeSys = data.activeSystem;

        // Tarjetas visuales activas
        document.getElementById('cardashCard').classList.toggle('active', activeSys === 'cardash' && cardash.isPlaying);
        document.getElementById('radioCard').classList.toggle('active', activeSys === 'radio' && radio.isPlaying);

        // --- 1. LÓGICA CARDASH (YOUTUBE) ---
        document.getElementById('cardashVol').innerText = `Volumen: ${cardash.volume}%`;
        if (isYtReady && ytPlayer && ytPlayer.loadVideoById) {
          if (activeSys === 'cardash' && cardash.isPlaying && cardash.videoId) {
            if (lastYtVideoId !== cardash.videoId) {
              lastYtVideoId = cardash.videoId;
              ytPlayer.loadVideoById(cardash.videoId);
              document.getElementById('cardashTitle').innerText = "Reproduciendo Track ID: " + cardash.videoId;
            }
            ytPlayer.setVolume(cardash.volume);
            if (ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING && audioUnlocked) {
              ytPlayer.playVideo();
            }
          } else {
            if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
              ytPlayer.pauseVideo();
            }
          }
        }

        // --- 2. LÓGICA RADIO FM ARGENTINA ---
        document.getElementById('radioVol').innerText = `Volumen: ${radio.volume}%`;
        if (activeSys === 'radio' && radio.isPlaying) {
          if (lastRadioStation !== radio.stationId) {
            lastRadioStation = radio.stationId;
            radioAudio.src = `/api/radio-stream/${radio.stationId}`;
            document.getElementById('radioStationTitle').innerText = radio.stationId.toUpperCase();
            if (audioUnlocked) radioAudio.play().catch(() => {});
          }
          
          radioAudio.volume = radio.volume / 100;
          if (radioAudio.paused && audioUnlocked) {
            radioAudio.play().catch(() => {});
          }
        } else {
          if (!radioAudio.paused) {
            radioAudio.pause();
          }
        }

      } catch (e) {
        // Ignorar fallos de conexión transitorios
      }
    }

    setInterval(pollStatus, 800);
  </script>
</body>
</html>
