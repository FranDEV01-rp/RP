<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Receptor Dual - CarDash & Stereo FM Argentina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .header-box {
      text-align: center;
      margin-bottom: 20px;
      max-width: 700px;
      width: 100%;
    }
    h1 { font-size: 1.6rem; color: #38bdf8; letter-spacing: 1px; }
    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-badge.online { background: #065f46; color: #34d399; }
    
    .panel {
      background: #131d31;
      border: 1px solid #1e293b;
      border-radius: 12px;
      width: 100%;
      max-width: 700px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .indicator-box {
      background: #070a13;
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #1e293b;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .indicator-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .indicator-val { font-weight: bold; color: #38bdf8; }
    .indicator-dial { font-size: 1.4rem; color: #f59e0b; font-family: monospace; font-weight: bold; }
    
    /* Contenedor del reproductor de YouTube */
    #yt-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-bottom: 15px;
    }
    #yt-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    
    .btn-init {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.2s;
    }
    .btn-init:hover { background: #1d4ed8; }
    .btn-init.connected { background: #059669; }

    .stations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .station-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .station-btn:hover { background: #334155; border-color: #38bdf8; }
    .station-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    .station-btn .s-dial { font-weight: bold; color: #f59e0b; display: block; }
    .station-btn.active .s-dial { color: #fff; }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>RECEPTOR MULTIMEDIA VEHICULAR</h1>
    <div id="conn-badge" class="status-badge">Conectando al servidor...</div>
  </div>

  <div class="panel">
    <button id="btn-audio-init" class="btn-init" onclick="unlockAudioSystem()">
      🔊 PULSAR AQUÍ PARA HABILITAR AUDIO
    </button>

    <div class="indicator-box">
      <div class="indicator-row">
        <span>SISTEMA ACTIVO:</span>
        <span id="txt-system" class="indicator-val">NINGUNO (STANDBY)</span>
      </div>
      <div class="indicator-row">
        <span>DIAL / CONTENIDO:</span>
        <span id="txt-dial" class="indicator-dial">---.-- MHz</span>
      </div>
      <div class="indicator-row">
        <span>DETALLE:</span>
        <span id="txt-detail" class="indicator-val">Esperando comando...</span>
      </div>
      <div class="indicator-row">
        <span>VOLUMEN EFECTIVO:</span>
        <span id="txt-vol" class="indicator-val">100%</span>
      </div>
    </div>

    <!-- YouTube para CarDash -->
    <div id="yt-wrapper" style="display: none;">
      <div id="player"></div>
    </div>

    <h3 style="font-size: 0.95rem; margin-bottom: 10px; color: #94a3b8;">
      DIALES FM/AM ARGENTINA (PRUEBA MANUAL / ROBLOX)
    </h3>
    <div id="stations-list" class="stations-grid">
      <!-- Generado dinámicamente -->
    </div>
  </div>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || "3618165542";

    let activeSystem = null; // "cardash" | "radio"
    let currentStationId = null;
    let targetVolume = 1.0;
    let stationsCatalog = {};
    let isTuningStatic = false;

    // Elemento de audio nativo para las radios (SIN crossOrigin para evitar bloqueos CORS)
    const radioAudio = new Audio();
    radioAudio.preload = "none";

    // Generador de ruido estático analógico ("ashhh") con Web Audio API
    let audioCtx = null;
    let staticSourceNode = null;
    let staticGainNode = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function unlockAudioSystem() {
      initAudioContext();
      // Reproducir silencio breve para desbloquear la política de autoplay
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      g.gain.value = 0.001;
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);

      const btn = document.getElementById('btn-audio-init');
      btn.innerText = "✓ AUDIO HABILITADO CORRECTAMENTE";
      btn.classList.add('connected');
    }

    function playStaticNoise(durationMs = 5000) {
      initAudioContext();
      stopStaticNoise();

      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * 0.45;
      }

      staticSourceNode = audioCtx.createBufferSource();
      staticSourceNode.buffer = buffer;
      staticSourceNode.loop = true;

      // Filtro de paso banda para simular sintonizador de radio analógica
      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1200;
      filter.Q.value = 0.8;

      staticGainNode = audioCtx.createGain();
      staticGainNode.gain.setValueAtTime(targetVolume * 0.45, audioCtx.currentTime);

      staticSourceNode.connect(filter);
      filter.connect(staticGainNode);
      staticGainNode.connect(audioCtx.destination);

      staticSourceNode.start();
      isTuningStatic = true;

      if (durationMs > 0) {
        setTimeout(() => {
          stopStaticNoise();
        }, durationMs);
      }
    }

    function stopStaticNoise() {
      if (staticSourceNode) {
        try {
          staticSourceNode.stop();
          staticSourceNode.disconnect();
        } catch(e) {}
        staticSourceNode = null;
      }
      if (staticGainNode) {
        try { staticGainNode.disconnect(); } catch(e) {}
        staticGainNode = null;
      }
      isTuningStatic = false;
    }

    // Cargar emisoras directas desde el servidor
    async function loadStations() {
      try {
        const res = await fetch('/api/stations');
        stationsCatalog = await res.json();
        const container = document.getElementById('stations-list');
        container.innerHTML = "";

        Object.keys(stationsCatalog).forEach(id => {
          const st = stationsCatalog[id];
          const btn = document.createElement('button');
          btn.className = "station-btn";
          btn.id = "btn-st-" + id;
          btn.innerHTML = `<span class="s-dial">${st.dial}</span>${st.name}<br><small style="color:#64748b;">${st.city}</small>`;
          btn.onclick = () => tuneStation(id);
          container.appendChild(btn);
        });
      } catch (err) {
        console.error("Error cargando catálogo de radios:", err);
      }
    }
    loadStations();

    // Sintonización directa de radio con fallback inteligente
    let tuningTimer = null;
    function tuneStation(stationId) {
      const station = stationsCatalog[stationId];
      if (!station) return;

      unlockAudioSystem();
      activeSystem = "radio";
      currentStationId = stationId;

      // Ocultar YouTube y pausarlo inmediatamente
      document.getElementById('yt-wrapper').style.display = 'none';
      if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
        ytPlayer.pauseVideo();
      }

      // Detener cualquier radio previa
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();

      // Actualizar UI
      document.getElementById('txt-system').innerText = "STEREO FM ARGENTINA";
      document.getElementById('txt-dial').innerText = station.dial;
      document.getElementById('txt-detail').innerText = `Sintonizando: ${station.name} (${station.city})...`;

      document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-st-' + stationId);
      if (activeBtn) activeBtn.classList.add('active');

      // 1. Reproducir estática realista durante 5 segundos
      playStaticNoise(5000);

      if (tuningTimer) clearTimeout(tuningTimer);

      // 2. Al cumplirse los 5 segundos, conectar la transmisión directa
      tuningTimer = setTimeout(() => {
        connectDirectStream(station, 0);
      }, 5000);
    }

    function connectDirectStream(station, urlIndex) {
      const candidates = station.urls || [];
      if (urlIndex >= candidates.length) {
        // Si todos los enlaces directos fallan, recurrir al proxy de Render
        console.warn("Intentando proxy de respaldo para:", station.name);
        document.getElementById('txt-detail').innerText = `En vivo: ${station.name} (Respaldo)`;
        radioAudio.src = `/api/radio-stream?id=${currentStationId}&t=${Date.now()}`;
        radioAudio.volume = targetVolume;
        radioAudio.play().catch(e => console.error("Error reproduciendo respaldo:", e));
        return;
      }

      const streamUrl = candidates[urlIndex];
      document.getElementById('txt-detail').innerText = `En vivo: ${station.name} (${station.city})`;

      // Limpiar listeners previos
      radioAudio.onerror = null;

      radioAudio.onerror = () => {
        console.warn(`Fallo URL ${urlIndex} para ${station.name}, intentando siguiente...`);
        connectDirectStream(station, urlIndex + 1);
      };

      radioAudio.src = streamUrl;
      radioAudio.volume = targetVolume;
      radioAudio.play().catch(err => {
        console.warn("Error al reproducir audio directo:", err);
        connectDirectStream(station, urlIndex + 1);
      });
    }

    // Integración de YouTube (CarDash Multimedia)
    let ytPlayer = null;
    let ytReady = false;

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': () => { ytReady = true; }
        }
      });
    };

    function playCarDashTrack(videoId) {
      unlockAudioSystem();
      activeSystem = "cardash";
      stopStaticNoise();

      // Apagar radio completamente
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();
      document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));

      // Mostrar reproductor de YouTube
      document.getElementById('yt-wrapper').style.display = 'block';
      document.getElementById('txt-system').innerText = "CARDASH MULTIMEDIA";
      document.getElementById('txt-dial').innerText = "YOUTUBE ID: " + videoId;
      document.getElementById('txt-detail').innerText = "Reproduciendo pista de audio/video";

      if (ytReady && ytPlayer) {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.setVolume(Math.round(targetVolume * 100));
        ytPlayer.playVideo();
      }
    }

    // Receptor SSE conectado a Render y Roblox
    const evtSource = new EventSource(`/events?userId=${userId}`);
    const badge = document.getElementById('conn-badge');

    evtSource.onopen = () => {
      badge.innerText = `CONECTADO: USER ${userId}`;
      badge.classList.add('online');
    };

    evtSource.onerror = () => {
      badge.innerText = "Reconectando con el servidor...";
      badge.classList.remove('online');
    };

    evtSource.onmessage = (e) => {
      try {
        const payload = JSON.parse(e.data);
        const { system, action, data } = payload;

        // Control de volumen por proximidad
        if (action === "volume") {
          const vol = Math.max(0, Math.min(100, parseInt(data) || 0)) / 100;
          targetVolume = vol;
          document.getElementById('txt-vol').innerText = `${Math.round(vol * 100)}%`;

          if (activeSystem === "cardash" && ytPlayer && typeof ytPlayer.setVolume === 'function') {
            ytPlayer.setVolume(Math.round(vol * 100));
          }
          if (activeSystem === "radio") {
            radioAudio.volume = vol;
          }
          if (isTuningStatic && staticGainNode && audioCtx) {
            staticGainNode.gain.setValueAtTime(vol * 0.45, audioCtx.currentTime);
          }
          return;
        }

        // Comandos de Radio FM
        if (system === "radio") {
          if (action === "play") {
            tuneStation(data);
          } else if (action === "pause") {
            radioAudio.pause();
            stopStaticNoise();
            document.getElementById('txt-detail').innerText = "Radio en pausa";
          }
        }

        // Comandos de CarDash (YouTube)
        if (system === "cardash") {
          if (action === "load" || action === "play") {
            playCarDashTrack(data);
          } else if (action === "pause") {
            if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
              ytPlayer.pauseVideo();
            }
            document.getElementById('txt-detail').innerText = "CarDash pausado";
          } else if (action === "resume") {
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
              ytPlayer.playVideo();
            }
            document.getElementById('txt-detail').innerText = "CarDash reanudado";
          }
        }
      } catch (err) {
        console.error("Error al procesar evento SSE:", err);
      }
    };
  </script>
</body>
</html>
