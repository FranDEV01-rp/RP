<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptor de Audio del Vehículo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #58a6ff;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    .status-badge.active {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
    }
    .btn-init {
      background: #238636;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background 0.2s;
    }
    .btn-init:hover {
      background: #2ea043;
    }
    .cardash-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }
    .cardash-viewport.visible {
      display: block;
    }
    .radio-display {
      background: #0a0c10;
      border: 1px solid #1f242c;
      border-radius: 8px;
      padding: 18px;
      margin-top: 16px;
      display: none;
    }
    .radio-display.visible {
      display: block;
    }
    .radio-dial {
      font-size: 2rem;
      font-weight: 700;
      color: #f0883e;
      font-family: monospace;
    }
    .radio-name {
      font-size: 1.1rem;
      color: #c9d1d9;
      margin-top: 4px;
    }
    .radio-static-anim {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 8px;
      font-style: italic;
    }
    .vol-indicator {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #8b949e;
    }
    /* Contenedor off-screen de YouTube para que el navegador mantenga el renderizado activo sin pausar el audio */
    #radio-yt-wrapper {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 320px;
      height: 180px;
      opacity: 0.001;
      pointer-events: none;
      z-index: -100;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Receptor de Sonido del Vehículo</h1>
    <div id="statusBadge" class="status-badge">Desconectado - Pulsa Activar</div>
    <br>
    <button id="btnInit" class="btn-init">Activar Audio del Vehículo</button>

    <!-- Reproductor CarDash (Pantalla Multimedia) -->
    <div id="cardashContainer" class="cardash-viewport">
      <div id="cardashPlayer"></div>
    </div>

    <!-- Pantalla Estéreo FM Argentina -->
    <div id="radioContainer" class="radio-display">
      <div id="radioDial" class="radio-dial">---.- FM</div>
      <div id="radioName" class="radio-name">Buscando señal...</div>
      <div id="radioStaticMsg" class="radio-static-anim" style="display: none;">Sintonizando señal analógica...</div>
    </div>

    <div id="volIndicator" class="vol-indicator">Volumen de Proximidad: 100%</div>
  </div>

  <!-- Contenedor fuera de pantalla para transmisiones de YouTube Live -->
  <div id="radio-yt-wrapper">
    <div id="radioYtPlayer"></div>
  </div>

  <!-- Audio HTML5 para streaming directo de emisoras -->
  <audio id="html5Audio" preload="none"></audio>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let audioContext = null;
    let cardashYt = null;
    let radioYt = null;
    let hlsInstance = null;

    let activeSystem = null; // "cardash" | "radio" | null
    let currentProximityVol = 100;
    let currentLoadedCardashId = "";
    let isTuningInProgress = false;
    let tuningTimer = null;
    let staticOscillatorNode = null;

    const html5Audio = document.getElementById("html5Audio");
    const statusBadge = document.getElementById("statusBadge");
    const btnInit = document.getElementById("btnInit");
    const cardashContainer = document.getElementById("cardashContainer");
    const radioContainer = document.getElementById("radioContainer");
    const radioDial = document.getElementById("radioDial");
    const radioName = document.getElementById("radioName");
    const radioStaticMsg = document.getElementById("radioStaticMsg");
    const volIndicator = document.getElementById("volIndicator");

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("userId") || "3618165542";

    // Inicialización del YouTube IFrame API
    window.onYouTubeIframeAPIReady = function() {
      cardashYt = new YT.Player('cardashPlayer', {
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: 0,
          controls: 1,
          rel: 0,
          playsinline: 1
        }
      });

      radioYt = new YT.Player('radioYtPlayer', {
        width: '320',
        height: '180',
        playerVars: {
          autoplay: 0,
          controls: 0,
          rel: 0,
          playsinline: 1
        },
        events: {
          'onError': onRadioYtError
        }
      });
    };

    function onRadioYtError(e) {
      console.warn("YouTube Live Radio error, ejecutando fallback a streams de audio...", e);
      if (window.pendingStreams && window.pendingStreams.length > 0) {
        playStreamsInCascade(window.pendingStreams);
      }
    }

    // Inicialización de permisos de audio al interactuar
    btnInit.addEventListener("click", () => {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      // Desbloqueo de elementos multimedia
      html5Audio.play().then(() => html5Audio.pause()).catch(() => {});
      
      btnInit.style.display = "none";
      statusBadge.textContent = "Receptor Conectado";
      statusBadge.classList.add("active");

      connectSSE();
    });

    // Conexión Server-Sent Events (SSE)
    function connectSSE() {
      const evtSource = new EventSource(`/events?userId=${userId}`);

      evtSource.onmessage = function(event) {
        try {
          const msg = JSON.parse(event.data);
          handleRemoteCommand(msg.system, msg.action, msg.data);
        } catch (e) {
          console.error("Error al procesar mensaje SSE:", e);
        }
      };

      evtSource.onerror = function() {
        statusBadge.textContent = "Reconectando con el vehículo...";
        statusBadge.classList.remove("active");
        setTimeout(connectSSE, 3000);
      };
    }

    // Manejo de comandos enviados desde Roblox
    function handleRemoteCommand(system, action, data) {
      if (action === "volume") {
        applyProximityVolume(parseInt(data, 10));
        return;
      }

      if (system === "cardash") {
        handleCarDashCommand(action, data);
      } else if (system === "radio") {
        handleRadioCommand(action, data);
      }
    }

    // ==========================================
    //   LÓGICA CARDASH MULTIMEDIA (YOUTUBE)
    // ==========================================
    function handleCarDashCommand(action, data) {
      if (activeSystem !== "cardash") {
        stopRadioSystem();
        activeSystem = "cardash";
        cardashContainer.classList.add("visible");
        radioContainer.classList.remove("visible");
      }

      if (action === "play") {
        const videoId = cleanYouTubeId(data);
        if (!videoId) return;

        if (currentLoadedCardashId === videoId && cardashYt && typeof cardashYt.playVideo === "function") {
          cardashYt.playVideo();
        } else {
          currentLoadedCardashId = videoId;
          if (cardashYt && typeof cardashYt.loadVideoById === "function") {
            cardashYt.loadVideoById(videoId);
          }
        }
      } else if (action === "pause") {
        if (cardashYt && typeof cardashYt.pauseVideo === "function") {
          cardashYt.pauseVideo();
        }
      }
    }

    function cleanYouTubeId(urlOrId) {
      if (!urlOrId) return "";
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = urlOrId.match(regExp);
      return (match && match[2].length === 11) ? match[2] : urlOrId;
    }

    function stopCarDashSystem() {
      if (cardashYt && typeof cardashYt.pauseVideo === "function") {
        cardashYt.pauseVideo();
      }
      cardashContainer.classList.remove("visible");
    }

    // ==========================================
    //   LÓGICA ESTÉREO FM ARGENTINA (RADIO)
    // ==========================================
    function handleRadioCommand(action, stationId) {
      if (action === "pause") {
        stopRadioSystem();
        activeSystem = null;
        return;
      }

      if (action === "play") {
        if (activeSystem !== "radio") {
          stopCarDashSystem();
          activeSystem = "radio";
          radioContainer.classList.add("visible");
          cardashContainer.classList.remove("visible");
        }

        tuneRadioStationWithStatic(stationId);
      }
    }

    // Proceso de Sintonización con 5 Segundos de Estática Analógica
    function tuneRadioStationWithStatic(stationId) {
      // Detener cualquier audio previo
      stopAudioStreamsOnly();

      // Iniciar Ruido de Estática Analógica
      isTuningInProgress = true;
      startAnalogStaticNoise();

      radioDial.textContent = "BUSCANDO...";
      radioName.textContent = "Sincronizando oscilador FM...";
      radioStaticMsg.style.display = "block";

      // Durante los 5 segundos de estática, resolver la mejor fuente en segundo plano
      fetch(`/api/resolve-station?id=${stationId}`)
        .then(res => res.json())
        .then(resolved => {
          if (tuningTimer) clearTimeout(tuningTimer);

          // Esperar estrictamente los 5 segundos antes de conectar la emisión
          tuningTimer = setTimeout(() => {
            stopAnalogStaticNoise();
            isTuningInProgress = false;
            radioStaticMsg.style.display = "none";

            if (resolved.success) {
              radioDial.textContent = resolved.dial;
              radioName.textContent = `${resolved.name} - ${resolved.city}`;
              playResolvedSource(resolved);
            } else {
              radioName.textContent = "Emisora fuera de alcance";
            }
          }, 5000);
        })
        .catch(err => {
          console.error("Error al resolver emisora:", err);
          if (tuningTimer) clearTimeout(tuningTimer);
          tuningTimer = setTimeout(() => {
            stopAnalogStaticNoise();
            isTuningInProgress = false;
            radioName.textContent = "Señal no disponible";
          }, 5000);
        });
    }

    function playResolvedSource(resolved) {
      window.pendingStreams = resolved.streams || [];

      // Si existe transmisión en vivo por YouTube Live, probar primero
      if (resolved.youtubeLiveId && radioYt && typeof radioYt.loadVideoById === "function") {
        radioYt.loadVideoById({
          videoId: resolved.youtubeLiveId,
          suggestedQuality: 'small'
        });
        radioYt.setVolume(currentProximityVol);
        radioYt.playVideo();

        // Verificar si reproduce correctamente tras 3.5 segundos; si no, pasar a cascada de streams
        setTimeout(() => {
          if (radioYt.getPlayerState && radioYt.getPlayerState() !== 1 && window.pendingStreams.length > 0) {
            radioYt.stopVideo();
            playStreamsInCascade(window.pendingStreams);
          }
        }, 3500);
      } else if (window.pendingStreams.length > 0) {
        playStreamsInCascade(window.pendingStreams);
      }
    }

    // Cascada de reproducción automática de URLs de audio
    function playStreamsInCascade(streamList) {
      if (!streamList || streamList.length === 0) return;
      const currentUrl = streamList[0];
      const remainingUrls = streamList.slice(1);

      html5Audio.pause();
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (currentUrl.includes(".m3u8")) {
        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(currentUrl);
          hlsInstance.attachMedia(html5Audio);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            html5Audio.volume = currentProximityVol / 100;
            html5Audio.play().catch(() => playStreamsInCascade(remainingUrls));
          });
          hlsInstance.on(Hls.Events.ERROR, () => {
            playStreamsInCascade(remainingUrls);
          });
        } else if (html5Audio.canPlayType('application/vnd.apple.mpegurl')) {
          html5Audio.src = currentUrl;
          html5Audio.volume = currentProximityVol / 100;
          html5Audio.play().catch(() => playStreamsInCascade(remainingUrls));
        }
      } else {
        html5Audio.src = currentUrl;
        html5Audio.volume = currentProximityVol / 100;
        
        const playPromise = html5Audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn(`Fallo al reproducir ${currentUrl}, pasando al siguiente servidor...`, err);
            playStreamsInCascade(remainingUrls);
          });
        }

        html5Audio.onerror = () => {
          console.warn(`Error de red en ${currentUrl}, pasando al siguiente servidor...`);
          playStreamsInCascade(remainingUrls);
        };
      }
    }

    function stopAudioStreamsOnly() {
      html5Audio.pause();
      html5Audio.removeAttribute('src');
      html5Audio.load();

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      if (radioYt && typeof radioYt.stopVideo === "function") {
        radioYt.stopVideo();
      }
    }

    function stopRadioSystem() {
      if (tuningTimer) clearTimeout(tuningTimer);
      stopAnalogStaticNoise();
      stopAudioStreamsOnly();
      radioContainer.classList.remove("visible");
    }

    // ==========================================
    //   SINTETIZADOR DE ESTÁTICA ANALÓGICA
    // ==========================================
    function startAnalogStaticNoise() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        const bufferSize = audioContext.sampleRate * 2;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const output = buffer.getChannelData(0);

        // Generación de Ruido Rosa/Blanco con fluctuaciones analógicas
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          output[i] = (b0 + b1 + b2 + white * 0.1) * 0.12;
        }

        const whiteNoiseSource = audioContext.createBufferSource();
        whiteNoiseSource.buffer = buffer;
        whiteNoiseSource.loop = true;

        const gainNode = audioContext.createGain();
        gainNode.gain.value = (currentProximityVol / 100) * 0.35;

        whiteNoiseSource.connect(gainNode);
        gainNode.connect(audioContext.destination);

        whiteNoiseSource.start();
        staticOscillatorNode = { source: whiteNoiseSource, gain: gainNode };
      } catch (e) {
        console.warn("No se pudo iniciar el sintetizador WebAudio:", e);
      }
    }

    function stopAnalogStaticNoise() {
      if (staticOscillatorNode) {
        try {
          staticOscillatorNode.source.stop();
          staticOscillatorNode.source.disconnect();
        } catch (e) {}
        staticOscillatorNode = null;
      }
    }

    // ==========================================
    //   CONTROL DE VOLUMEN POR PROXIMIDAD
    // ==========================================
    function applyProximityVolume(volumePercent) {
      currentProximityVol = Math.max(0, Math.min(100, volumePercent));
      volIndicator.textContent = `Volumen de Proximidad: ${currentProximityVol}%`;

      const normalizedVol = currentProximityVol / 100;

      // 1. CarDash
      if (cardashYt && typeof cardashYt.setVolume === "function") {
        cardashYt.setVolume(currentProximityVol);
      }

      // 2. Radio YouTube
      if (radioYt && typeof radioYt.setVolume === "function") {
        radioYt.setVolume(currentProximityVol);
      }

      // 3. Radio HTML5 / HLS
      html5Audio.volume = normalizedVol;

      // 4. Estática
      if (staticOscillatorNode && staticOscillatorNode.gain) {
        staticOscillatorNode.gain.gain.value = normalizedVol * 0.35;
      }
    }
  </script>
</body>
</html>
