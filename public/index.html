<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CarDash OS - Receiver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0a0b10; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard {
            background: #141721;
            border: 2px solid #23293d;
            border-radius: 20px;
            padding: 25px;
            width: 420px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #23293d;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .header h1 { font-size: 18px; color: #00e676; letter-spacing: 1px; }
        .status-dot {
            width: 12px; height: 12px; background: #ff5252;
            border-radius: 50%; box-shadow: 0 0 10px #ff5252;
        }
        .status-dot.active { background: #00e676; box-shadow: 0 0 12px #00e676; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 10px;
            background: #0a0b10;
            border: 1px solid #323b57;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            text-align: center;
            outline: none;
        }
        button.btn-primary {
            background: #00e676;
            color: #05140b;
            font-weight: bold;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .info-card {
            background: #0d0f17;
            border: 1px solid #1c2233;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .info-card .label { font-size: 11px; color: #6a7694; text-transform: uppercase; }
        .info-card .value { font-size: 14px; color: #e2e8f0; font-weight: bold; margin-top: 4px; }

        /* Contenedor visible de YouTube */
        #player-wrapper {
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #23293d;
            display: flex;
            justify-content: center;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>🚗 CARDASH RECEIVER</h1>
            <div id="statusDot" class="status-dot"></div>
        </div>

        <div class="input-group">
            <input type="text" id="uid" placeholder="Tu UserId de Roblox">
            <button class="btn-primary" onclick="vincular()">Vincular</button>
        </div>

        <div class="info-card">
            <div class="label">Pista en reproducción</div>
            <div class="value" id="trackText">Esperando canción...</div>
        </div>

        <!-- Video de YouTube visible para que no se bloquee -->
        <div id="player-wrapper">
            <div id="player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let lastTimestamp = 0;
        let syncInterval = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '180',
                width: '370',
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 1 
                }
            });
        }

        function vincular() {
            const uid = document.getElementById('uid').value.trim();
            if (!uid) return alert("Ingresa tu UserId");

            document.getElementById('statusDot').classList.add('active');
            document.getElementById('trackText').innerText = "✅ Sincronizado. Esperando al auto...";

            if (syncInterval) clearInterval(syncInterval);

            // Preguntamos al servidor cada 800 milisegundos si Roblox mandó algo nuevo
            syncInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/status/${uid}`);
                    const data = await res.json();

                    // Si hay una orden nueva que no hayamos ejecutado
                    if (data.timestamp && data.timestamp > lastTimestamp) {
                        lastTimestamp = data.timestamp;
                        console.log("Nueva orden recibida de Roblox:", data);

                        if (data.action === 'play' && player && player.loadVideoById) {
                            document.getElementById('trackText').innerText = "Reproduciendo: " + data.data;
                            player.loadVideoById(data.data);
                            player.playVideo();
                        } else if (data.action === 'pause' && player && player.pauseVideo) {
                            document.getElementById('trackText').innerText = "Pausado desde el auto";
                            player.pauseVideo();
                        } else if (data.action === 'volume' && player && player.setVolume) {
                            player.setVolume(Number(data.data));
                        }
                    }
                } catch (e) {
                    console.log("Error sincronizando:", e);
                }
            }, 800);
        }
    </script>
</body>
</html>
