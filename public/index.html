<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptor de Audio del Vehículo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.3rem; margin-bottom: 8px; color: #58a6ff; }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    .status-badge.active {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
    }
    .btn-init {
      background: #238636;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .cardash-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }
    .cardash-box.visible { display: block; }
    
    .radio-box {
      background: #0a0c10;
      border: 1px solid #1f242c;
      border-radius: 8px;
      padding: 18px;
      margin-top: 16px;
      display: none;
      position: relative;
    }
    .radio-box.visible { display: block; }
    .radio-dial {
      font-size: 2.2rem;
      font-weight: 700;
      color: #f0883e;
      font-family: monospace;
    }
    .radio-name {
      font-size: 1.1rem;
      color: #c9d1d9;
      margin-top: 4px;
    }
    .static-indicator {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 8px;
      font-style: italic;
    }
    /* El reproductor de YouTube de la radio se mantiene dentro del DOM visible con 1px 
       para evitar que Chrome suspenda la pestaña o congele el audio por estar fuera de pantalla */
    .radio-yt-dock {
      width: 240px;
      height: 135px;
      margin: 12px auto 0 auto;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      display: none;
    }
    .radio-yt-dock.active { display: block; }
    .vol-display {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Receptor de Audio del Vehículo</h1>
    <div id="statusBadge" class="status-badge">Desconectado - Presiona Activar</div>
    <br>
    <button id="btnInit" class="btn-init">Activar Audio del Vehículo</button>

    <!-- Pantalla CarDash Multimedia -->
    <div id="cardashBox" class="cardash-box">
      <div id="cardashPlayer"></div>
    </div>

    <!-- Pantalla Estéreo Radio FM -->
    <div id="radioBox" class="radio-box">
      <div id="radioDial" class="radio-dial">---.- FM</div>
      <div id="radioName" class="radio-name">Buscando señal...</div>
      <div id="staticText" class="static-indicator" style="display: none;">Sintonizando oscilador analógico...</div>
      
      <!-- Visor de Radio YouTube cuando la emisora emite video/audio en directo -->
      <div id="radioYtDock" class="radio-yt-dock">
        <div id="radioYtPlayer"></div>
      </div>
    </div>

    <div id="volDisplay" class="vol-display">Volumen: 100%</div>
  </div>

  <audio id="radioAudio" preload="none"></audio>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let audioCtx = null;
    let cardashYt = null;
    let radioYt = null;
    let hls = null;

    let activeSystem = null; // "cardash" | "radio"
    let currentVol = 100;
    let currentCardashTrackId = "";
    let tuningTimeout = null;
    let staticNoise = null;
    let pendingStreamsList = [];

    const radioAudio = document.getElementById("radioAudio");
    const statusBadge = document.getElementById("statusBadge");
    const btnInit = document.getElementById("btnInit");
    const cardashBox = document.getElementById("cardashBox");
    const radioBox = document.getElementById("radioBox");
    const radioDial = document.getElementById("radioDial");
    const radioName = document.getElementById("radioName");
    const staticText = document.getElementById("staticText");
    const radioYtDock = document.getElementById("radioYtDock");
    const volDisplay = document.getElementById("volDisplay");

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("userId") || "3618165542";

    // Inicialización de la API de YouTube
    window.onYouTubeIframeAPIReady = function() {
      cardashYt = new YT.Player('cardashPlayer', {
        width: '100%',
        height: '100%',
        playerVars: { autoplay: 0, controls: 1, rel: 0, playsinline: 1 }
      });

      radioYt = new YT.Player('radioYtPlayer', {
        width: '100%',
        height: '100%',
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1 },
        events: {
          'onStateChange': onRadioYtStateChange,
          'onError': onRadioYtError
        }
      });
    };

    // Si YouTube Live queda en estado PAUSADO o EN ESPERA (Cued), forzar reproducción inmediata
    function onRadioYtStateChange(event) {
      if (activeSystem === "radio") {
        // YT.PlayerState.PAUSED = 2, YT.PlayerState.CUED = 5
        if (event.data === 2 || event.data === 5) {
          event.target.playVideo();
        }
      }
    }

    // Si el video de YouTube tiene error o bloqueo geográfico, pasar automáticamente a streams de audio
    function onRadioYtError() {
      radioYtDock.classList.remove("active");
      if (pendingStreamsList.length > 0) {
        tryNextAudioStream();
      }
    }

    // Activación de permisos de audio
    btnInit.addEventListener("click", () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      radioAudio.play().then(() => radioAudio.pause()).catch(() => {});

      btnInit.style.display = "none";
      statusBadge.textContent = "Conectado al Vehículo";
      statusBadge.classList.add("active");

      startEventStream();
    });

    function startEventStream() {
      const sse = new EventSource(`/events?userId=${userId}`);
      sse.onmessage = function(e) {
        try {
          const payload = JSON.parse(e.data);
          handleCommand(payload.system, payload.action, payload.data);
        } catch (err) {}
      };
      sse.onerror = function() {
        statusBadge.textContent = "Reconectando con el vehículo...";
        statusBadge.classList.remove("active");
        setTimeout(startEventStream, 3000);
      };
    }

    function handleCommand(system, action, data) {
      if (action === "volume") {
        setProximityVolume(parseInt(data, 10));
        return;
      }

      if (system === "cardash") {
        handleCarDash(action, data);
      } else if (system === "radio") {
        handleRadio(action, data);
      }
    }

    // LÓGICA CARDASH MULTIMEDIA
    function handleCarDash(action, data) {
      if (activeSystem !== "cardash") {
        stopRadio();
        activeSystem = "cardash";
        cardashBox.classList.add("visible");
        radioBox.classList.remove("visible");
      }

      if (action === "play") {
        const id = extractYtId(data);
        if (!id) return;
        if (currentCardashTrackId === id && cardashYt && typeof cardashYt.playVideo === "function") {
          cardashYt.playVideo();
        } else {
          currentCardashTrackId = id;
          if (cardashYt && typeof cardashYt.loadVideoById === "function") {
            cardashYt.loadVideoById(id);
          }
        }
      } else if (action === "pause") {
        if (cardashYt && typeof cardashYt.pauseVideo === "function") {
          cardashYt.pauseVideo();
        }
      }
    }

    function extractYtId(val) {
      if (!val) return "";
      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const m = val.match(reg);
      return (m && m[2].length === 11) ? m[2] : val;
    }

    function stopCarDash() {
      if (cardashYt && typeof cardashYt.pauseVideo === "function") {
        cardashYt.pauseVideo();
      }
      cardashBox.classList.remove("visible");
    }

    // LÓGICA ESTÉREO RADIO FM ARGENTINA
    function handleRadio(action, stationId) {
      if (action === "pause") {
        stopRadio();
        activeSystem = null;
        return;
      }

      if (action === "play") {
        if (activeSystem !== "radio") {
          stopCarDash();
          activeSystem = "radio";
          radioBox.classList.add("visible");
          cardashBox.classList.remove("visible");
        }

        tuneStation(stationId);
      }
    }

    function tuneStation(stationId) {
      stopRadioPlayback();

      // Iniciar los 5 segundos de ruido blanco analógico ("ashhhhh")
      startStaticNoise();
      radioDial.textContent = "SINTONIZANDO";
      radioName.textContent = "Buscando emisión en vivo...";
      staticText.style.display = "block";
      radioYtDock.classList.remove("active");

      // Buscar transmisiones en vivo mientras suena la estática
      fetch(`/api/resolve-station?id=${stationId}`)
        .then(r => r.json())
        .then(resolved => {
          if (tuningTimeout) clearTimeout(tuningTimeout);

          // Completar obligatoriamente los 5 segundos antes de conectar el audio
          tuningTimeout = setTimeout(() => {
            stopStaticNoise();
            staticText.style.display = "none";

            if (resolved.success) {
              radioDial.textContent = resolved.dial;
              radioName.textContent = `${resolved.name} - ${resolved.city}`;
              playResolvedStation(resolved);
            } else {
              radioName.textContent = "Señal fuera de cobertura";
            }
          }, 5000);
        })
        .catch(() => {
          if (tuningTimeout) clearTimeout(tuningTimeout);
          tuningTimeout = setTimeout(() => {
            stopStaticNoise();
            staticText.style.display = "none";
            radioName.textContent = "Sin señal de radio";
          }, 5000);
        });
    }

    function playResolvedStation(data) {
      pendingStreamsList = [...(data.streams || [])];

      // Si se encontró una emisión en YouTube Live activa (caso Urbana Play), usarla
      if (data.youtubeId && radioYt && typeof radioYt.loadVideoById === "function") {
        radioYtDock.classList.add("active");
        radioYt.loadVideoById(data.youtubeId);
        radioYt.setVolume(currentVol);
        radioYt.playVideo();

        // Control de verificación: si tras 3 segundos no reproduce, conmutar a audio directo
        setTimeout(() => {
          if (radioYt.getPlayerState && radioYt.getPlayerState() !== 1) {
            radioYt.playVideo(); // Segundo intento de despausar
            setTimeout(() => {
              if (radioYt.getPlayerState && radioYt.getPlayerState() !== 1) {
                radioYtDock.classList.remove("active");
                tryNextAudioStream();
              }
            }, 1500);
          }
        }, 3000);
      } else {
        tryNextAudioStream();
      }
    }

    function tryNextAudioStream() {
      if (pendingStreamsList.length === 0) return;
      const url = pendingStreamsList.shift();

      radioAudio.pause();
      if (hls) { hls.destroy(); hls = null; }

      if (url.includes(".m3u8")) {
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(radioAudio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            radioAudio.volume = currentVol / 100;
            radioAudio.play().catch(() => tryNextAudioStream());
          });
          hls.on(Hls.Events.ERROR, () => tryNextAudioStream());
        } else if (radioAudio.canPlayType('application/vnd.apple.mpegurl')) {
          radioAudio.src = url;
          radioAudio.volume = currentVol / 100;
          radioAudio.play().catch(() => tryNextAudioStream());
        }
      } else {
        radioAudio.src = url;
        radioAudio.volume = currentVol / 100;
        const p = radioAudio.play();
        if (p !== undefined) {
          p.catch(() => tryNextAudioStream());
        }
        radioAudio.onerror = () => tryNextAudioStream();
      }
    }

    function stopRadioPlayback() {
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();
      if (hls) { hls.destroy(); hls = null; }
      if (radioYt && typeof radioYt.stopVideo === "function") {
        radioYt.stopVideo();
      }
      radioYtDock.classList.remove("active");
    }

    function stopRadio() {
      if (tuningTimeout) clearTimeout(tuningTimeout);
      stopStaticNoise();
      stopRadioPlayback();
      radioBox.classList.remove("visible");
    }

    // GENERADOR DE RUIDO ANALÓGICO
    function startStaticNoise() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const out = buffer.getChannelData(0);

        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const w = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179;
          b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520;
          out[i] = (b0 + b1 + b2 + w * 0.1) * 0.14;
        }

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;

        const gain = audioCtx.createGain();
        gain.gain.value = (currentVol / 100) * 0.4;

        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start();

        staticNoise = { source, gain };
      } catch (e) {}
    }

    function stopStaticNoise() {
      if (staticNoise) {
        try {
          staticNoise.source.stop();
          staticNoise.source.disconnect();
        } catch (e) {}
        staticNoise = null;
      }
    }

    // CONTROL DE VOLUMEN POR PROXIMIDAD
    function setProximityVolume(vol) {
      currentVol = Math.max(0, Math.min(100, vol));
      volDisplay.textContent = `Volumen de Proximidad: ${currentVol}%`;

      const norm = currentVol / 100;
      if (cardashYt && typeof cardashYt.setVolume === "function") cardashYt.setVolume(currentVol);
      if (radioYt && typeof radioYt.setVolume === "function") radioYt.setVolume(currentVol);
      radioAudio.volume = norm;
      if (staticNoise && staticNoise.gain) staticNoise.gain.gain.value = norm * 0.4;
    }
  </script>
</body>
</html>
