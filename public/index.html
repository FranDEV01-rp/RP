<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CarDash Multimedia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .panel {
      background: #131d31;
      border: 1px solid #1e293b;
      border-radius: 12px;
      width: 100%;
      max-width: 680px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
    }
    h1 { font-size: 1.6rem; color: #38bdf8; margin-bottom: 6px; }
    .status-badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-badge.online { background: #065f46; color: #34d399; }
    .btn-unlock {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .btn-unlock:hover { background: #1d4ed8; }
    .btn-unlock.ready { background: #059669; }
    #player-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-bottom: 20px;
      border: 1px solid #1e293b;
    }
    #player-wrapper iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
    .info-box {
      background: #070a13;
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      font-size: 0.95rem;
    }
    .info-row { display: flex; justify-content: space-between; }
    .info-val { font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="panel">
    <h1>CARDASH MULTIMEDIA</h1>
    <div id="conn-status" class="status-badge">Conectando con el vehículo...</div>

    <button id="btn-audio" class="btn-unlock" onclick="unlockAudio()">
      🔊 PULSAR AQUÍ PARA HABILITAR AUDIO
    </button>

    <div id="player-wrapper">
      <div id="yt-player"></div>
    </div>

    <div class="info-box">
      <div class="info-row">
        <span>ESTADO:</span>
        <span id="txt-state" class="info-val">En espera de pista</span>
      </div>
      <div class="info-row">
        <span>TRACK ACTUAL:</span>
        <span id="txt-track" class="info-val">Ninguno</span>
      </div>
      <div class="info-row">
        <span>VOLUMEN (PROXIMIDAD):</span>
        <span id="txt-vol" class="info-val">100%</span>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || "3618165542";

    let ytPlayer = null;
    let isReady = false;
    let currentVolume = 100;
    let pendingVideoId = null;

    function unlockAudio() {
      const btn = document.getElementById('btn-audio');
      btn.innerText = "✓ AUDIO DESBLOQUEADO CORRECTAMENTE";
      btn.classList.add('ready');

      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        const state = ytPlayer.getPlayerState();
        if (state === 2) {
          ytPlayer.playVideo();
        }
      }
    }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'rel': 0,
          'modestbranding': 1,
          'playsinline': 1
        },
        events: {
          'onReady': () => {
            isReady = true;
            ytPlayer.setVolume(currentVolume);
            if (pendingVideoId) {
              ytPlayer.loadVideoById(pendingVideoId);
              pendingVideoId = null;
            }
          },
          'onStateChange': (event) => {
            const txtState = document.getElementById('txt-state');
            if (event.data === YT.PlayerState.PLAYING) {
              txtState.innerText = "Reproduciendo";
            } else if (event.data === YT.PlayerState.PAUSED) {
              txtState.innerText = "Pausado (Mantiene posición)";
            } else if (event.data === YT.PlayerState.ENDED) {
              txtState.innerText = "Finalizado";
            } else if (event.data === YT.PlayerState.BUFFERING) {
              txtState.innerText = "Cargando...";
            }
          }
        }
      });
    };

    function extractVideoId(input) {
      if (!input) return "";
      input = input.trim();
      const match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : (input.length === 11 ? input : input);
    }

    const evtSource = new EventSource(`/events?userId=${userId}`);
    const badge = document.getElementById('conn-status');

    evtSource.onopen = () => {
      badge.innerText = `CONECTADO: USER ID ${userId}`;
      badge.classList.add('online');
    };

    evtSource.onerror = () => {
      badge.innerText = "Reconectando con el vehículo...";
      badge.classList.remove('online');
    };

    evtSource.onmessage = (e) => {
      try {
        const payload = JSON.parse(e.data);
        const action = payload.action;
        const data = payload.data;

        if (action === "play" || action === "load") {
          const videoId = extractVideoId(data);
          document.getElementById('txt-track').innerText = videoId;
          document.getElementById('txt-state').innerText = "Cargando pista...";

          if (isReady && ytPlayer) {
            ytPlayer.loadVideoById(videoId);
            ytPlayer.setVolume(currentVolume);
            ytPlayer.playVideo();
          } else {
            pendingVideoId = videoId;
          }
        } 
        else if (action === "pause") {
          if (isReady && ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            ytPlayer.pauseVideo();
            document.getElementById('txt-state').innerText = "Pausado";
          }
        } 
        else if (action === "resume") {
          if (isReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
            ytPlayer.playVideo();
            document.getElementById('txt-state').innerText = "Reproduciendo";
          }
        } 
        else if (action === "volume") {
          const vol = Math.max(0, Math.min(100, parseInt(data) || 0));
          currentVolume = vol;
          document.getElementById('txt-vol').innerText = `${vol}%`;
          if (isReady && ytPlayer && typeof ytPlayer.setVolume === 'function') {
            ytPlayer.setVolume(vol);
          }
        }
      } catch (err) {
        console.error("Error al procesar comando:", err);
      }
    };
  </script>
</body>
</html>
