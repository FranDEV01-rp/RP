<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CarDash Receiver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0a0b10; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard {
            background: #141721;
            border: 2px solid #23293d;
            border-radius: 20px;
            padding: 25px;
            width: 440px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #23293d;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .header h1 { font-size: 18px; color: #00e676; letter-spacing: 1px; }
        .status-dot {
            width: 12px; height: 12px; background: #ff5252;
            border-radius: 50%; box-shadow: 0 0 10px #ff5252;
        }
        .status-dot.active { background: #00e676; box-shadow: 0 0 12px #00e676; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 10px;
            background: #0a0b10;
            border: 1px solid #323b57;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            text-align: center;
            outline: none;
        }
        button.btn-primary {
            background: #00e676;
            color: #05140b;
            font-weight: bold;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .info-card {
            background: #0d0f17;
            border: 1px solid #1c2233;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .info-card .label { font-size: 11px; color: #6a7694; text-transform: uppercase; margin-bottom: 4px; }
        .info-card .value { font-size: 13px; color: #00e676; font-family: monospace; word-break: break-all; }

        /* Contenedor del video */
        #player-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #23293d;
            background: #000;
            height: 220px;
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>🚗 CARDASH RECEIVER</h1>
            <div id="statusDot" class="status-dot"></div>
        </div>

        <div class="input-group">
            <input type="text" id="uid" placeholder="PIN Secreto (4 dígitos)">
            <button class="btn-primary" onclick="vincular()">Vincular</button>
        </div>

        <div class="info-card">
            <div class="label">Estado de transmisión</div>
            <div class="value" id="statusText">Presiona Vincular para comenzar</div>
        </div>

        <!-- REPRODUCTOR NATIVO QUE NUNCA SE BLOQUEA -->
        <div id="player-wrapper">
            <iframe id="ytFrame" 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&autoplay=0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        let lastTimestamp = 0;
        let isLinked = false;

        function setStatus(text, color = "#00e676") {
            const el = document.getElementById('statusText');
            el.innerText = text;
            el.style.color = color;
        }

        function vincular() {
            const uid = document.getElementById('uid').value.trim();
            if (!uid) return alert("Ingresa tu UserId");

            document.getElementById('statusDot').classList.add('active');
            setStatus("✅ Conectado a Roblox. Esperando auto...");
            isLinked = true;

            // Consultar al servidor cada 800ms
            setInterval(async () => {
                try {
                    const res = await fetch('/api/status/' + uid);
                    const data = await res.json();

                    if (data.timestamp && data.timestamp > lastTimestamp) {
                        lastTimestamp = data.timestamp;
                        console.log("Comando recibido:", data);

                        const frame = document.getElementById('ytFrame');

                        if (data.action === 'play') {
                            setStatus("▶️ Reproduciendo: " + data.data);
                            // Cargar video directamente por URL con autoplay forzado
                            frame.src = `https://www.youtube.com/embed/${data.data}?autoplay=1&enablejsapi=1`;
                        } 
                        else if (data.action === 'pause') {
                            setStatus("⏸️ Pausado desde el auto", "#ffb300");
                            // Pausar enviando mensaje al iframe
                            frame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                        } 
                        else if (data.action === 'volume') {
                            frame.contentWindow.postMessage(`{"event":"command","func":"setVolume","args":[${data.data}]}`, '*');
                        }
                    }
                } catch (e) {
                    console.error("Error en sincronización:", e);
                }
            }, 800);
        }
    </script>
</body>
</html>
